name: Fetch user-provided baseline Geode

on:
  push:
    paths:
      - ".github/workflows/fetch-baseline.yml"

jobs:
  fetch-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch MediaFire page and direct asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, sys, os
          page = "https://www.mediafire.com/file/00o35y02mpavl6v/35jkh23.geode/file"
          req = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=40) as r:
              html = r.read().decode("utf-8", "replace")
              print("Page status:", r.status, "URL:", r.geturl(), "bytes:", len(html))
          open("mediafire-page.html", "w", encoding="utf-8").write(html)
          matches = re.findall(r'<a\b[^>]*\bid=["\']downloadButton["\'][^>]*\bhref=["\']([^"\']+)', html, re.I)
          if not matches:
              matches = re.findall(r'<a\b[^>]*\bhref=["\']([^"\']+)["\'][^>]*\bid=["\']downloadButton["\']', html, re.I)
          if not matches:
              matches = re.findall(r'https?://download\d+\.mediafire\.com/[^"\'\s<>]+', html, re.I)
          if not matches:
              print("No direct download URL was found in the MediaFire HTML.")
              # Save only a small excerpt useful for diagnosing the page.
              for needle in ("downloadButton", "mediafire.com/file", "File is private"):
                  i = html.find(needle)
                  if i >= 0: print("EXCERPT", needle, repr(html[max(0, i-250):i+600]))
              sys.exit(2)
          direct = matches[0].replace("&amp;", "&")
          print("Direct URL host:", re.match(r"https?://[^/]+", direct).group(0))
          req = urllib.request.Request(direct, headers={"User-Agent": "Mozilla/5.0", "Referer": page})
          with urllib.request.urlopen(req, timeout=90) as r:
              data = r.read()
              print("Download status:", r.status, "URL:", r.geturl(), "bytes:", len(data),
                    "content-type:", r.headers.get("Content-Type"))
          open("35jkh23.geode", "wb").write(data)
          if data[:2] != b"PK":
              print("Downloaded item is not a ZIP/Geode package; first 200 bytes:", repr(data[:200]))
              sys.exit(3)
          PY
      - name: Upload temporary baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mediafire-baseline-geode
          path: 35jkh23.geode
          if-no-files-found: error
      - name: Upload diagnostic page if download did not succeed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mediafire-fetch-diagnostics
          path: mediafire-page.html
          if-no-files-found: ignore
