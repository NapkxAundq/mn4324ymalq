name: Build Predictive Input Buffer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Windows / Geometry Dash 2.2081
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
          use-lto: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
